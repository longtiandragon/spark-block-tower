[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-freeze"
version = "0.1.0"
description = "SPARK 蓝色积木移动搬运与分层搭建工作台"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "pydantic>=2.9,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9"]
speech = ["edge-tts>=7,<8"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "ros/spark_freeze_bridge/tests", "ros/spark_blocks_bridge/tests"]
pythonpath = ["backend", "ros/spark_blocks_bridge/src"]

